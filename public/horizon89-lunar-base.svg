<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative HORIZON 89 lunar research outpost</title>
  <desc id="desc">A cinematic lunar landscape with craters, a research habitat, astronaut, rover, mountains and deep space.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#01030b"/><stop offset=".62" stop-color="#071426"/><stop offset="1" stop-color="#163b50"/></linearGradient>
    <linearGradient id="ground" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#9aa7ae"/><stop offset=".38" stop-color="#59666f"/><stop offset="1" stop-color="#18232b"/></linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a9b6bc"/><stop offset="1" stop-color="#303c44"/></linearGradient>
    <linearGradient id="habitat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbe3e5"/><stop offset=".55" stop-color="#8c9ca3"/><stop offset="1" stop-color="#35434c"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9aeaff" stop-opacity=".72"/><stop offset="1" stop-color="#36bde7" stop-opacity="0"/></radialGradient>
    <radialGradient id="crater"><stop offset=".5" stop-color="#1a252c"/><stop offset=".72" stop-color="#46545c"/><stop offset="1" stop-color="#a6b2b7"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#02070c" flood-opacity=".8"/></filter>
    <pattern id="stars" width="170" height="130" patternUnits="userSpaceOnUse"><circle cx="18" cy="29" r="1.2" fill="#d9f3ff"/><circle cx="89" cy="71" r=".8" fill="#8ec8e3"/><circle cx="153" cy="18" r=".6" fill="#fff"/><circle cx="130" cy="113" r="1" fill="#b8d9e9"/></pattern>
  </defs>
